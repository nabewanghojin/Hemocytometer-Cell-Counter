name: Build Windows exe

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.11.1

      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Cellgorithm
          --icon cellgorithm.ico
          --splash splash.png
          --add-data "cellgorithm.ico;."
          --add-data "cellgorithm_intro.mp4;."
          Cellgorithm.py

      - name: Keep the exe as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cellgorithm-windows
          path: dist/Cellgorithm.exe

      - name: Attach the exe to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Cellgorithm.exe
